{{- $root := . -}}
{{- $uuid := include "api-gateway.uuid" . -}}
{{- range $env := .Values.environments }}
---
# Route class "channel": the only platform calls a channel may make (docs/channels/README.md).
# Never routed: the raw status read, /api/v1/applicants/**, /api/v1/ops/**, /actuator/**, docs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: channel-{{ $env.name }}
  labels: {{- include "api-gateway.labels" $root | nindent 4 }}
    route-class: channel
    env: {{ $env.name }}
spec:
  parentRefs:
    - { name: api, sectionName: http-{{ $env.name }} }
  hostnames: [{{ $env.host | quote }}]
  rules:
    - name: submit
      matches:
        - method: POST
          path: { type: Exact, value: /api/v1/applications }
          {{- include "api-gateway.customerKeyMatch" $root | nindent 10 }}
      backendRefs: &platform
        - { name: onboarding-service, namespace: {{ $env.platformNamespace }}, port: 8080 }
    - name: next-action
      matches:
        - method: GET
          path: { type: RegularExpression, value: "^/api/v1/applications/{{ $uuid }}/next-action$" }
          {{- include "api-gateway.customerKeyMatch" $root | nindent 10 }}
      backendRefs: *platform
    - name: withdrawal
      matches:
        - method: POST
          path: { type: RegularExpression, value: "^/api/v1/applications/{{ $uuid }}/withdrawal$" }
          {{- include "api-gateway.customerKeyMatch" $root | nindent 10 }}
      backendRefs: *platform
    - name: erasure-request
      matches:
        - method: POST
          path: { type: RegularExpression, value: "^/api/v1/applications/{{ $uuid }}/erasure-requests$" }
          {{- include "api-gateway.customerKeyMatch" $root | nindent 10 }}
      backendRefs: *platform
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: channel-{{ $env.name }}
  labels: {{- include "api-gateway.labels" $root | nindent 4 }}
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: channel-{{ $env.name }} }
  jwt:
    providers:
      - name: cards
        issuer: {{ $root.Values.iam.issuer | quote }}
        audiences: [{{ $env.audience | quote }}]
        remoteJWKS:
          uri: {{ $root.Values.iam.jwksUri | quote }}
          cacheDuration: 60s
        claimToHeaders:
          - { claim: azp, header: x-channel-client }
  authorization:
    defaultAction: Deny
    rules:
      - name: channel-clients
        action: Allow
        principal:
          jwt:
            provider: cards
            claims:
              - name: azp
                values: {{- toYaml $env.clients | nindent 18 }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: channel-{{ $env.name }}
  labels: {{- include "api-gateway.labels" $root | nindent 4 }}
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: channel-{{ $env.name }} }
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - { type: Distinct, name: x-channel-client }
          limit: { requests: {{ $root.Values.limits.channelClientPerMinute }}, unit: Minute }
        - clientSelectors:
            - headers:
                - { type: Distinct, name: x-channel-client }
                - { type: Distinct, name: x-customer-key }
          limit: { requests: {{ $root.Values.limits.channelCustomerPerMinute }}, unit: Minute }
  timeout:
    http:
      requestTimeout: {{ $root.Values.timeouts.channel }}
  responseOverride:
    # Only the gateway's own refusals: a backend's 429 (for example OTP_RESEND_TOO_SOON with its
    # own Retry-After) must reach the channel unchanged.
    - source: Local
      match:
        statusCodes: [{ type: Value, value: 429 }]
      response:
        contentType: application/json
        body:
          type: Inline
          inline: '{"errorCode":"RATE_LIMITED","message":"Too many requests"}'
        header:
          set:
            - { name: Retry-After, value: {{ $root.Values.limits.retryAfterSeconds | quote }} }
{{- end }}
